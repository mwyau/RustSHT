name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        if: matrix.os == 'ubuntu-24.04' || github.ref_name == 'main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --all-features

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: 1.99.1
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build Python extension and install development dependencies
        run: uv sync --python 3.11
      - name: Test compiled extension import
        run: uv run --no-sync pytest python/tests
