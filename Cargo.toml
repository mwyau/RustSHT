[package]
name = "rustsht"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.99"
authors = ["Albert M. W. Yau"]
license = "GPL-2.0-or-later"
description = "Rust spherical harmonic transforms library"
repository = "https://github.com/mwyau/RustSHT"
readme = "README.md"
keywords = ["spherical-harmonics", "sht", "numerics", "atmosphere"]
categories = ["science"]

exclude = [
    "/AGENTS.md",
    "/plans/",
]

[workspace]
members = ["python"]
resolver = "3"

[dependencies]
num-complex = "0.4"
pulp = { version = "0.22.3", features = ["x86-v4"] }
rustfft = "6.4"
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(rustsht_avx2_mask_all)',
    'cfg(rustsht_disable_analysis_pair_range_cache)',
    'cfg(rustsht_disable_paired_odd_fft)',
    'cfg(rustsht_profile_spin32_normalizer)',
    'cfg(rustsht_unchecked_analysis_pair_range)',
] }

[[example]]
name = "m1a_bench"
required-features = ["parallel"]

[[example]]
name = "m1b_bench"
required-features = ["parallel"]

[[example]]
name = "m4_f32_bench"
required-features = ["parallel"]

[[example]]
name = "m5_batch_bench"
required-features = ["parallel"]

[[example]]
name = "m1_f32_atmospheric_bench"
required-features = ["parallel"]

[[example]]
name = "ducc_full_transform_parity"
required-features = ["parallel"]

[[example]]
name = "ducc_spin1_full_transform_parity"
required-features = ["parallel"]

[[example]]
name = "ducc_f32_full_transform_parity"
required-features = ["parallel"]
