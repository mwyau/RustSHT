[package]
name = "rustsht"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.89"
authors = ["Albert M. W. Yau"]
license = "GPL-2.0-or-later"
description = "Rust spherical harmonic transforms library"
repository = "https://github.com/mwyau/RustSHT"
readme = "README.md"
keywords = ["spherical-harmonics", "sht", "numerics", "atmosphere"]
categories = ["science"]

exclude = [
    "/AGENTS.md",
    "/plans/",
]

[workspace]
members = ["python"]
resolver = "3"

[dependencies]
num-complex = "0.4"
pulp = { version = "0.22.3", features = ["x86-v4"] }
rustfft = "6.4"
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[[example]]
name = "m1a_bench"
required-features = ["parallel"]

[[example]]
name = "m1b_bench"
required-features = ["parallel"]
